name: Build BongoCat-AutoClicker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Creer le fichier EXE
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            pyinstaller --onefile --windowed --icon=icon.ico --name="BongoCat-AutoClicker" main.py
          } else {
            pyinstaller --onefile --windowed --name="BongoCat-AutoClicker" main.py
          }

      - name: Publier le EXE dans GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BongoCat-AutoClicker.exe
