
name: Creer mon AutoClicker EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
        shell: pwsh

      - name: Creer le fichier EXE
        shell: pwsh
        run: |
          if (Test-Path icon.ico) {
            pyinstaller --clean --onefile --windowed --icon=icon.ico --name="BongoCat-AutoClicker" main.py
          } else {
            pyinstaller --clean --onefile --windowed --name="BongoCat-AutoClicker" main.py
          }

      - name: Deposer le EXE en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-AutoClicker-Windows
          path: dist/BongoCat-AutoClicker.exe
